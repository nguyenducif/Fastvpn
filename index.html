<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASTVPN - Chào mừng đến với thế giới 4G tốc độ cao</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Logo / Avatar */
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
        }

        .logo-container i {
            font-size: 40px;
            color: #ffffff;
        }

        /* Tiêu đề */
        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-text {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Thẻ tính năng nổi bật */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.07);
            padding: 12px 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-box i {
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 6px;
            display: block;
        }

        .feature-box span {
            display: block;
            font-size: 12px;
            color: #e2e8f0;
            font-weight: 600;
        }

        /* Nút bấm (Links) */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn i {
            font-size: 18px;
        }

        /* Nút 1: Mua 4G */
        .btn-buy {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        /* Nút 2: Cộng đồng 4G */
        .btn-community {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        /* Nút 3: Liên hệ Admin */
        .btn-contact {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid rgba(52, 211, 153, 0.4);
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo / Biểu tượng -->
        <div class="logo-container">
            <i class="fa-solid fa-signal"></i>
        </div>

        <!-- Tiêu đề thương hiệu -->
        <h1 class="brand-title">FASTVPN</h1>
        <p class="welcome-text">Chào mừng bạn đến với hệ thống 4G tốc độ cao, ổn định và tiết kiệm nhất!</p>

        <!-- Điểm nổi bật đã sửa lỗi thẻ span -->
        <div class="features">
            <div class="feature-box">
                <i class="fa-solid fa-bolt"></i>
                <span>Tốc độ cao</span>
            </div>
            <div class="feature-box">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Bảo mật</span>
            </div>
            <div class="feature-box">
                <i class="fa-solid fa-headset"></i>
                <span>Hỗ trợ 24/7</span>
            </div>
        </div>

        <!-- Danh sách nút bấm -->
        <div class="links-container">
            <!-- Link 1 -->
            <a href="https://fastvpn.io.vn" target="_blank" class="btn btn-buy">
                <i class="fa-solid fa-cart-shopping"></i>
                Mua 4G
            </a>

            <!-- Link 2 -->
            <a href="https://zalo.me/g/qclbuyfoecyurr5krsmi" target="_blank" class="btn btn-community">
                <i class="fa-solid fa-users"></i>
                Cộng đồng 4G
            </a>

            <!-- Link 3 -->
            <a href="https://zalo.me/0383530002" target="_blank" class="btn btn-contact">
                <i class="fa-solid fa-comment-dots"></i>
                Liên hệ Admin
            </a>
        </div>

        <!-- Chân trang -->
        <div class="footer">
            &copy; 2026 FASTVPN. All rights reserved.
        </div>
    </div>

</body>
</html>
